
services:

  postgres:

    image: postgres:16

    container_name: postgres

    restart: always

    environment:

      POSTGRES_DB: tarea

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: 2612

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  backend:

    build: ./backend

    container_name: backend

    restart: always

    ports:

      - "3000:3000"

    env_file:

      - ./backend/.env

    depends_on:

      - postgres

  frontend:

    build: ./frontend

    container_name: frontend

    restart: always

    ports:

      - "5173:5173"

    depends_on:

      - backend

volumes:

  postgres_data: