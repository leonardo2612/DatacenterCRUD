name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Actualizar VPS
        uses: appleboy/ssh-action@master

        with:

          host: ${{ secrets.VPS_HOST }}

          username: ${{ secrets.VPS_USER }}

          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            cd ~/DatacenterCRUD

            git pull origin main

            cd backend

            npm install

            pm2 restart all